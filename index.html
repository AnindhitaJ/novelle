<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novelle</title>
<meta name="description" content="Ruang menulis novel pribadi">
<meta name="theme-color" content="#5B3A78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--pl:#5B3A78;--dp:#35233F;--lv:#B8A0E8;--pale:#F0EAF8;--bg:#FAF8F5;--sf:#fff;--tx:#29242F;--t2:#77717E;--bd:#E7E1EB;--ok:#1e7a46;--er:#b42323;--wn:#9a6400;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--pl:#B8A0E8;--dp:#F0EAF8;--pale:#2E2338;--bg:#17131B;--sf:#1F1A25;--tx:#EEE9F2;--t2:#A59DAD;--bd:#3A3144;--ok:#5cc88a;--er:#ff8a8a;--wn:#f0b84d;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0 0 10px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:6px 12px}
button:hover:not(:disabled){background:var(--pale)}button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--pl);border-color:var(--pl);color:var(--bg)}button.ghost{border-color:transparent;background:none}button.danger{color:var(--er)}
input,textarea,select{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%}
:focus-visible{outline:2px solid var(--lv);outline-offset:2px}
a{color:var(--pl)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--sf);position:sticky;top:0;z-index:5}
.logo{font:600 22px Georgia,serif;color:var(--pl);text-decoration:none}
.sp{flex:1}.muted{color:var(--t2);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{border:1px solid var(--bd);border-radius:10px;background:var(--sf);overflow:hidden}
.cover{aspect-ratio:3/4;background:linear-gradient(160deg,var(--pl),#35233F);color:#F0EAF8;display:flex;align-items:flex-end;padding:14px;font:600 20px/1.2 Georgia,serif;text-decoration:none}
.meta{padding:10px 12px}.bar{height:5px;background:var(--pale);border-radius:3px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pl)}
.empty{border:1px dashed var(--bd);border-radius:10px;padding:30px;text-align:center;color:var(--t2)}
.li{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--sf)}
.ws{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:1000px){.ws{grid-template-columns:1fr}}
.side{border:1px solid var(--bd);border-radius:10px;background:var(--sf);padding:10px}
.ch{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:8px}.ch.on{background:var(--pale);font-weight:600}
.ch button.nm{flex:1;text-align:left;border:0;background:none;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none}.tabs button[aria-selected=true]{border-color:var(--pl);color:var(--pl);font-weight:600}
.tool{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.tool button[aria-pressed=true]{background:var(--pale);border-color:var(--lv)}
.editor{min-height:60vh;outline:none;font-family:Georgia,"Times New Roman",serif;font-size:var(--fs,18px);line-height:1.75;max-width:var(--w,700px);margin:0 auto;padding:6px 2px}
.editor p{margin:0 0 .9em}
.ttl{font:600 26px Georgia,serif;border:0;background:none;padding:6px 0;max-width:var(--w,700px);display:block;margin:0 auto}
.st{font-size:13px}.st.ok{color:var(--ok)}.st.err{color:var(--er)}.st.wk{color:var(--wn)}
.focus .top,.focus .side,.focus .tool,.focus .tabs,.focus .panel{display:none}.focus .ws{grid-template-columns:1fr}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--dp);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:9}
.warn{background:var(--pale);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
[role=dialog]{position:fixed;inset:5vh 5vw;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;overflow:auto;z-index:20}
article{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
[role=tab]{border:0;border-radius:0;background:none}[role=tab][aria-selected=true]{border-bottom:2px solid var(--pl);font-weight:600}

</style>
</head>
<body>
<div id="root"><main style="max-width:480px;margin:10vh auto;padding:16px"><p>Memuat…</p><noscript>Novelle membutuhkan JavaScript.</noscript></main></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
